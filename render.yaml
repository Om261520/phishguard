services:
  - type: web
    name: phishguard
    env: python
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r backend/requirements.txt && python ml/train_model.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./phishguard.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'
